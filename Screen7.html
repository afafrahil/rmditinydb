<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Penilaian (Mobile SPA)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a7a5e;
      --primary-dark: #145f49;
      --bg-color: #05822d;
      --card-bg: #ffffff;
      --text-main: #1a3c34;
      --text-muted: #666666;
      --border-color: #e2e8f0;
      --error: #e53e3e;
      --success: #38a169;
      --online-color: #2b6cb0;
      --offline-color: #ed8936;
      --own-bg: #1a7a5e;
      --own-text: #ffffff;
      --other-bg: #fef3c7;
      --other-text: #1a3c34;
    }
    /* ... (semua CSS sama seperti sebelumnya, tidak diubah) ... */
  </style>
</head>
<body>
  <!-- HTML structure SAMA seperti sebelumnya, tidak diubah -->
  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbx5B_NzjJr7wtcLq3ocnsIS51XbNN8BcecM9L8pe86ouwxKSrBKaORz2q8di1YbyD4_/exec";

    // ==========================================
    // CUSTOM MODAL (sama seperti sebelumnya)
    // ==========================================
    let __modalKonfirmasiResolve = null;
    function showKonfirmasi(msg, title = 'Konfirmasi') {
      return new Promise(resolve => {
        __modalKonfirmasiResolve = resolve;
        document.getElementById('modalKonfirmasiTitle').textContent = title;
        document.getElementById('modalKonfirmasiMsg').textContent = msg;
        document.getElementById('modalKonfirmasi').classList.add('active');
      });
    }
    function modalKonfirmasiResolve_(val) {
      document.getElementById('modalKonfirmasi').classList.remove('active');
      if (__modalKonfirmasiResolve) { __modalKonfirmasiResolve(val); __modalKonfirmasiResolve = null; }
    }

    let __modalPilihanHapusResolve = null;
    function showPilihanHapus(msg, title = 'Hapus Penilaian') {
      return new Promise(resolve => {
        __modalPilihanHapusResolve = resolve;
        document.getElementById('modalPilihanHapusTitle').textContent = title;
        document.getElementById('modalPilihanHapusMsg').textContent = msg;
        document.getElementById('modalPilihanHapus').classList.add('active');
      });
    }
    function modalPilihanHapusResolve_(val) {
      document.getElementById('modalPilihanHapus').classList.remove('active');
      if (__modalPilihanHapusResolve) { __modalPilihanHapusResolve(val); __modalPilihanHapusResolve = null; }
    }

    let __modalDataServerResolve = null;
    function showPilihanDataServer(msg, title = 'Data Server') {
      return new Promise(resolve => {
        __modalDataServerResolve = resolve;
        document.getElementById('modalDataServerTitle').textContent = title;
        document.getElementById('modalDataServerMsg').textContent = msg;
        document.getElementById('modalDataServer').classList.add('active');
      });
    }
    function modalDataServerResolve_(val) {
      document.getElementById('modalDataServer').classList.remove('active');
      if (__modalDataServerResolve) { __modalDataServerResolve(val); __modalDataServerResolve = null; }
    }

    let __modalAlertResolve = null;
    function showAlert(msg, title = 'Informasi') {
      return new Promise(resolve => {
        __modalAlertResolve = resolve;
        document.getElementById('modalAlertTitle').textContent = title;
        document.getElementById('modalAlertMsg').textContent = msg;
        document.getElementById('modalAlert').classList.add('active');
      });
    }
    function modalAlertResolve_() {
      document.getElementById('modalAlert').classList.remove('active');
      if (__modalAlertResolve) { __modalAlertResolve(); __modalAlertResolve = null; }
    }

    // ==========================================
    // STATE
    // ==========================================
    let user = null;
    let assignments = [];
    let currentClass = null;
    let currentAspek = null;
    let aspekData = null;
    let rekapOnlineData = null;

    // ==========================================
    // CORE UTILS
    // ==========================================
    async function apiCall(action, params = {}) {
      const payload = Object.assign({ action }, params);
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        return res.json();
      } catch (e) {
        console.error("API Error:", e);
        return { success: false, message: "Koneksi ke server gagal.", offline: true };
      }
    }

    function showLoading(show, text = 'Memuat...') {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }

    function navTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      window.scrollTo(0, 0);
    }

    // ==========================================
    // JEMBATAN KE TINYDB KODULAR
    // ==========================================
    const kPending = {};
    let kReqCounter = 0;

    window.__kodularResponse = function(reqId, opType, success, payload) {
      try {
        const pending = kPending[reqId];
        if (!pending) return;
        delete kPending[reqId];
        if (typeof payload === 'string') {
          payload = payload.split('+').join(' ');
        }
        if (!success) {
          pending.reject(new Error(payload || 'Operasi TinyDB gagal'));
          return;
        }
        if (opType === 'LIST') {
          const tags = payload ? payload.split(',').filter(Boolean) : [];
          pending.resolve({ success: true, tags });
        } else {
          pending.resolve({ success: true, value: payload });
        }
      } catch (e) {
        console.error('Gagal memproses respons Kodular:', e);
      }
    };

    function kSend_(op, tag, value) {
      return new Promise((resolve, reject) => {
        if (!window.AppInventor || !window.AppInventor.setWebViewString) {
          reject(new Error('Bridge Kodular (AppInventor) tidak tersedia. Buka aplikasi ini melalui WebViewer di Kodular.'));
          return;
        }
        const reqId = 'r' + (++kReqCounter) + '_' + Date.now();
        kPending[reqId] = { resolve, reject };
        const payload = { reqId, op, tag };
        if (value !== undefined) payload.value = value;
        window.AppInventor.setWebViewString(JSON.stringify(payload));
        setTimeout(() => {
          if (kPending[reqId]) {
            delete kPending[reqId];
            reject(new Error('Waktu tunggu TinyDB habis untuk operasi ' + op + ' (' + tag + ')'));
          }
        }, 8000);
      });
    }

    const kStorage = {
      async get(tag) {
        const res = await kSend_('GET', tag);
        return (res.value !== undefined && res.value !== null && res.value !== '') ? res.value : null;
      },
      async set(tag, value) {
        await kSend_('SET', tag, value);
        return true;
      },
      async delete(tag) {
        await kSend_('DELETE', tag);
        return true;
      },
      async list(prefix) {
        const res = await kSend_('LIST', prefix || '');
        return res.tags || [];
      },
      async getJSON(tag, fallback = null) {
        const v = await this.get(tag);
        if (!v) return fallback;
        try { return JSON.parse(v); } catch (e) { return fallback; }
      },
      async setJSON(tag, obj) {
        return this.set(tag, JSON.stringify(obj));
      }
    };

    function tagSafe(str) {
      return String(str).trim().replace(/[^a-zA-Z0-9]+/g, '_').toUpperCase();
    }

    function siswaTag(kelas) {
      return 'SISWA_' + tagSafe(kelas);
    }

    function nilaiTag(kelas, mapel, aspek) {
      return 'NILAI_' + tagSafe(kelas) + '_' + tagSafe(mapel) + '_' + tagSafe(aspek);
    }

    function nilaiSyncMetaTag(kelas, mapel, aspek) {
      return 'NILAI_SYNC_META_' + tagSafe(kelas) + '_' + tagSafe(mapel) + '_' + tagSafe(aspek);
    }

    function nilaiPendingDeleteTag(kelas, mapel, aspek) {
      return 'NILAI_PENDING_DELETE_' + tagSafe(kelas) + '_' + tagSafe(mapel) + '_' + tagSafe(aspek);
    }

    function userSessionTag() {
      return 'USER_SESSION';
    }

    function formatWaktu_(iso) {
      try {
        return new Date(iso).toLocaleString('id-ID');
      } catch (e) {
        return iso;
      }
    }

    const ASPEK_LIST = ['PENGETAHUAN', 'KETERAMPILAN', 'SPIRITUAL', 'SOSIAL', 'KEHADIRAN'];

    // ==========================================
    // SPLASH SCREEN & INFO LEMBAGA
    // ==========================================
    const SPLASH_HOLD_AFTER_DATA = 5000;
    let pendingHeaderReveal = null;

    function hideSplashScreen() {
      setTimeout(() => {
        if (pendingHeaderReveal) pendingHeaderReveal();
        resolveInitialPage();
        const splash = document.getElementById('splashScreen');
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 550);
      }, SPLASH_HOLD_AFTER_DATA);
    }

    function infoLembagaTag() {
      return 'INFO_LEMBAGA';
    }

    async function loadInfoLembaga() {
      try {
        let res = await apiCall('getInfoLembaga');
        const headerEl = document.getElementById('appHeader');
        const loadingBar = document.querySelector('.splash-loading-bar');
        if (res && res.success) {
          try { await kStorage.setJSON(infoLembagaTag(), res); } catch (e) { console.log(e); }
        } else {
          try {
            const cached = await kStorage.getJSON(infoLembagaTag(), null);
            if (cached && cached.success) res = cached;
          } catch (e) { console.log(e); }
        }
        if (!res || !res.success) {
          document.getElementById('splashTitle').textContent = 'Aplikasi Penilaian';
          pendingHeaderReveal = () => { headerEl.style.display = 'none'; };
          if (loadingBar) loadingBar.classList.add('hidden');
          hideSplashScreen();
          return;
        }
        document.getElementById('appNamaLembaga').textContent = res.namaLembaga || 'Aplikasi Penilaian';
        const periodeText = [res.tahunAjaran, res.semester].filter(Boolean).join(' ');
        document.getElementById('appPeriode').textContent = periodeText;
        const logoEl = document.getElementById('appLogo');
        if (res.logoUrl) { logoEl.src = res.logoUrl; logoEl.style.visibility = 'visible'; } else { logoEl.style.visibility = 'hidden'; }
        document.getElementById('splashTitle').textContent = res.appNama || 'Aplikasi Penilaian';
        document.getElementById('splashLembaga').textContent = res.namaLembaga || "";
        document.getElementById('splashPeriode').innerHTML = `Tahun Ajaran ${res.tahunAjaran || ''}<br>Semester ${res.semester || ''}`;
        const splashLogoEl = document.getElementById('splashLogo');
        if (res.logoUrl) { splashLogoEl.src = res.logoUrl; splashLogoEl.style.visibility = 'visible'; } else { splashLogoEl.style.visibility = 'hidden'; }
        if (loadingBar) loadingBar.classList.add('hidden');
        if (res.appNama) document.title = res.appNama;
        pendingHeaderReveal = () => { headerEl.style.display = 'flex'; };
        hideSplashScreen();
      } catch (e) {
        console.error('Error di loadInfoLembaga:', e);
        document.getElementById('splashTitle').textContent = 'Aplikasi Penilaian';
        pendingHeaderReveal = () => { document.getElementById('appHeader').style.display = 'none'; };
        document.querySelector('.splash-loading-bar').classList.add('hidden');
        hideSplashScreen();
      }
    }

    // ==========================================
    // TOGGLE PASSWORD
    // ==========================================
    function togglePasswordVisibility() {
      const pwInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden ?
        `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.86 21.86 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.86 21.86 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>` :
        `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>`;
    }

    // ==========================================
    // AUTHENTICATION
    // ==========================================
    async function resolveInitialPage() {
      try {
        const savedSession = await kStorage.getJSON(userSessionTag(), null);
        if (savedSession && savedSession.username && savedSession.password) {
          const loginRes = await apiCall('login', { username: savedSession.username, password: savedSession.password });
          if (loginRes.success) { user = loginRes; loadDashboard(); return; }
          if (loginRes.offline) {
            user = { username: savedSession.username, nama: savedSession.nama || savedSession.username, role: savedSession.role };
            loadDashboard(); return;
          }
        }
      } catch (e) { console.log(e); }
      const params = new URLSearchParams(window.location.search);
      const u = params.get('username');
      const p = params.get('password');
      if (u && p) { doLogin(u, p); } else {
        const savedUser = sessionStorage.getItem('user');
        if (savedUser) { user = JSON.parse(savedUser); loadDashboard(); } else { navTo('page-login'); }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadInfoLembaga();
    });

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      await doLogin(u, p);
    }

    async function doLogin(u, p) {
      const btn = document.getElementById('btnLogin');
      const msg = document.getElementById('loginMsg');
      if (btn) btn.disabled = true;
      msg.textContent = '';
      showLoading(true, 'Autentikasi...');
      const res = await apiCall('login', { username: u, password: p });
      if (btn) btn.disabled = false;
      showLoading(false);
      if (res.success) {
        user = res;
        sessionStorage.setItem('user', JSON.stringify(user));
        try {
          await kStorage.setJSON(userSessionTag(), { username: u, password: p, nama: res.nama, role: res.role, loginAt: new Date().toISOString() });
        } catch (e) { console.log(e); }
        if (window.AppInventor) {
          window.AppInventor.setWebViewString(JSON.stringify({ status: "login_success", username: u, password: p }));
        }
        showLoading(true, 'Menyinkronkan data guru...');
        try { await sinkronData(true); } catch (e) { console.log('Auto-sinkron gagal:', e); }
        loadDashboard();
      } else {
        msg.textContent = res.message;
        navTo('page-login');
      }
    }

    async function logout() {
      sessionStorage.removeItem('user');
      user = null;
      try { await kStorage.delete(userSessionTag()); } catch (e) { console.log(e); }
      if (window.AppInventor) {
        window.AppInventor.setWebViewString(JSON.stringify({ status: "logout", waktu: Date.now() }));
      }
      navTo('page-login');
    }

    // ==========================================
    // DASHBOARD
    // ==========================================
    async function loadDashboard() {
      navTo('page-dashboard');
      document.getElementById('userGreeting').textContent = user.nama;
      showLoading(true, 'Memuat daftar kelas...');
      let res = await apiCall('getGuruAssignments', { username: user.username });
      if (!res.success) {
        try {
          const cached = await kStorage.getJSON('ASSIGNMENTS', null);
          if (cached && cached.length) { res = { success: true, data: cached }; }
        } catch (e) {}
      }
      showLoading(false);
      if (!res.success) { await showAlert(res.message); refreshSyncStatus(); return; }
      assignments = res.data;
      const listEl = document.getElementById('classList');
      listEl.innerHTML = '';
      assignments.forEach(a => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div>
            <div class="item-title">${a.mapel}</div>
            <div class="item-subtitle">Kelas ${a.kelas}</div>
          </div>
          <div style="color: var(--primary); font-weight: bold;">&rarr;</div>
        `;
        card.onclick = () => openRekap(a.kelas, a.mapel);
        listEl.appendChild(card);
      });
      refreshSyncStatus();
    }

    // ==========================================
    // SINKRON DATA GURU
    // ==========================================
    async function refreshSyncStatus() {
      const statusEl = document.getElementById('syncStatus');
      if (!statusEl) return;
      try {
        const meta = await kStorage.getJSON('SYNC_META', null);
        statusEl.textContent = (meta && meta.syncedAt) ? 'Tersinkron: ' + formatWaktu_(meta.syncedAt) : 'Belum pernah sinkron';
      } catch (e) {
        statusEl.textContent = 'Mode online (bridge TinyDB tidak terdeteksi)';
      }
    }

    async function sinkronData(silent = false) {
      const btn = document.getElementById('btnSinkron');
      const statusEl = document.getElementById('syncStatus');
      if (btn) btn.disabled = true;
      showLoading(true, 'Menyinkronkan data...');
      try {
        const res = await apiCall('getSyncData', { username: user.username });
        if (!res.success) { if (!silent) await showAlert('Gagal sinkron: ' + res.message, 'Gagal'); return; }
        await kStorage.setJSON('ASSIGNMENTS', res.assignments);
        const kelasList = Object.keys(res.siswaByKelas);
        for (const kelas of kelasList) {
          await kStorage.setJSON(siswaTag(kelas), res.siswaByKelas[kelas]);
        }
        await kStorage.setJSON('SYNC_META', { syncedAt: res.syncedAt, nama: res.nama, periode: res.periode });
        if (statusEl) statusEl.textContent = 'Tersinkron: ' + formatWaktu_(res.syncedAt);
        if (!silent) await showAlert('Sinkron berhasil ✓\n' + res.assignments.length + ' kelas/mapel & data siswa tersimpan offline.\nSekarang input nilai bisa dilakukan tanpa internet.', 'Sinkron Berhasil');
      } catch (e) {
        if (!silent) await showAlert('Gagal sinkron: ' + e.message, 'Gagal');
      } finally {
        showLoading(false);
        if (btn) btn.disabled = false;
      }
    }

    // ==========================================
    // REKAP & MENU ASPEK
    // ==========================================
    async function openRekap(kelas, mapel) {
      currentClass = { kelas, mapel };
      navTo('page-rekap');
      document.getElementById('rekapTitle').textContent = `${kelas} • ${mapel}`;
      const tbody = document.getElementById('tbodyRekap');
      tbody.innerHTML = '<tr><td colspan="9">Memuat data offline...</td></tr>';
      try {
        const siswa = await kStorage.getJSON(siswaTag(kelas), null);
        if (!siswa) {
          tbody.innerHTML = `<tr><td colspan="9" style="color:red;">Data siswa belum tersinkron. Kembali ke Dashboard dan tekan "Sinkron Data" terlebih dahulu.</td></tr>`;
          return;
        }
        const nilaiPerAspek = {};
        for (const aspek of ASPEK_LIST) {
          nilaiPerAspek[aspek] = await kStorage.getJSON(nilaiTag(kelas, mapel, aspek), {});
        }
        const rekapOffline = hitungRekap_(siswa, nilaiPerAspek);
        tbody.innerHTML = '';
        siswa.forEach(s => {
          const nOff = rekapOffline[s.nis] || {};
          const tr = document.createElement('tr');
          let html = `<td class="sticky-col text-left">${s.nama}</td>`;
          const fields = ['pengetahuan', 'keterampilan', 'spiritual', 'sosial', 'hadir', 'sakit', 'izin', 'alfa'];
          fields.forEach(f => {
            const val = nOff[f];
            const hasVal = val !== undefined && val !== null && val !== '' && val !== 0;
            const displayVal = hasVal ? val : '-';
            const className = 'value-cell' + (hasVal ? '' : ' empty');
            html += `<td class="${className}">${displayVal}</td>`;
          });
          tr.innerHTML = html;
          tbody.appendChild(tr);
        });
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="9" style="color:red;">${e.message}</td></tr>`;
      }
    }

    // ==========================================
    // HITUNG REKAP (SEMUA DATA, TIDAK DIFILTER)
    // ==========================================
    function hitungRekap_(siswa, nilaiPerAspek) {
      const calcAvg = (obj) => {
        const vals = Object.values(obj || {}).map(v => {
          if (v && typeof v === 'object' && v.nilai !== undefined) return Number(v.nilai);
          return Number(v);
        }).filter(n => !isNaN(n));
        if (!vals.length) return 0;
        return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
      };
      const countPresence = (obj, code) => {
        return Object.values(obj || {}).filter(v => {
          const val = (v && typeof v === 'object' && v.nilai !== undefined) ? v.nilai : v;
          return String(val).toUpperCase() === code;
        }).length;
      };
      const rekap = {};
      siswa.forEach(s => {
        const nis = s.nis;
        rekap[nis] = {
          pengetahuan: calcAvg(nilaiPerAspek.PENGETAHUAN[nis]),
          keterampilan: calcAvg(nilaiPerAspek.KETERAMPILAN[nis]),
          spiritual: calcAvg(nilaiPerAspek.SPIRITUAL[nis]),
          sosial: calcAvg(nilaiPerAspek.SOSIAL[nis]),
          hadir: countPresence(nilaiPerAspek.KEHADIRAN[nis], 'H'),
          sakit: countPresence(nilaiPerAspek.KEHADIRAN[nis], 'S'),
          izin: countPresence(nilaiPerAspek.KEHADIRAN[nis], 'I'),
          alfa: countPresence(nilaiPerAspek.KEHADIRAN[nis], 'A')
        };
      });
      return rekap;
    }

    // ==========================================
    // INPUT ASPEK
    // ==========================================
    async function openAspek(aspek) {
      currentAspek = aspek;
      navTo('page-aspek');
      document.getElementById('aspekTitle').textContent = `Input ${aspek}`;
      showLoading(true, 'Memuat data siswa (offline)...');
      try {
        const siswa = await kStorage.getJSON(siswaTag(currentClass.kelas), null);
        if (!siswa) {
          showLoading(false);
          await showAlert('Data siswa belum tersinkron. Kembali ke Dashboard dan tekan "Sinkron Data" terlebih dahulu.', 'Data Belum Tersinkron');
          openRekap(currentClass.kelas, currentClass.mapel);
          return;
        }
        const nilai = await kStorage.getJSON(nilaiTag(currentClass.kelas, currentClass.mapel, aspek), {});
        aspekData = {
          siswa: siswa,
          nilai: nilai,
          daftarTanggal: computeDaftarTanggal_(nilai)
        };
        showLoading(false);
        renderAspekTable();
        refreshAspekSyncStatus();
      } catch (e) {
        showLoading(false);
        await showAlert('Gagal memuat data: ' + e.message, 'Gagal');
        openRekap(currentClass.kelas, currentClass.mapel);
      }
    }

    // ==========================================
    // KOMPUTASI TANGGAL
    // ==========================================
    function computeDaftarTanggal_(nilaiMap) {
      const set = new Set();
      Object.values(nilaiMap || {}).forEach(m => {
        Object.keys(m || {}).forEach(key => {
          const tanggal = key.split('_')[0];
          if (tanggal) set.add(tanggal);
        });
      });
      return Array.from(set).sort();
    }

    // ==========================================
    // KONVERSI DATA DARI SERVER
    // ==========================================
    function konversiDataDariServer(nilaiFromServer) {
      const result = {};
      Object.keys(nilaiFromServer || {}).forEach(nis => {
        result[nis] = {};
        Object.keys(nilaiFromServer[nis] || {}).forEach(tanggal => {
          const entry = nilaiFromServer[nis][tanggal];
          if (entry && typeof entry === 'object' && entry.nilai !== undefined) {
            const username = entry.username || 'unknown';
            const key = tanggal + '_' + username;
            result[nis][key] = { nilai: entry.nilai, username: username };
          } else if (entry !== undefined && entry !== null && entry !== '') {
            const key = tanggal + '_' + (user ? user.username : 'unknown');
            result[nis][key] = { nilai: entry, username: user ? user.username : 'unknown' };
          }
        });
      });
      return result;
    }

    // ==========================================
    // SINKRON NILAI PER ASPEK (HANYA KIRIM DATA MILIK SENDIRI)
    // ==========================================
    async function refreshAspekSyncStatus() {
      const statusEl = document.getElementById('aspekSyncStatus');
      if (!statusEl || !currentClass || !currentAspek) return;
      try {
        const meta = await kStorage.getJSON(nilaiSyncMetaTag(currentClass.kelas, currentClass.mapel, currentAspek), null);
        statusEl.textContent = (meta && meta.syncedAt) ? 'Nilai tersinkron: ' + formatWaktu_(meta.syncedAt) : 'Nilai belum pernah disinkron';
      } catch (e) {
        statusEl.textContent = '';
      }
    }

    async function sinkronNilaiAspek() {
      if (!currentClass || !currentAspek) return;
      const btn = document.getElementById('btnSinkronNilai');
      if (btn) btn.disabled = true;
      const pendingTag = nilaiPendingDeleteTag(currentClass.kelas, currentClass.mapel, currentAspek);

      try {
        const nilaiLokal = await kStorage.getJSON(nilaiTag(currentClass.kelas, currentClass.mapel, currentAspek), {});
        const adaDataLokal = nilaiLokal && Object.keys(nilaiLokal).length > 0;

        if (!adaDataLokal) {
          showLoading(true, 'Mengambil data nilai dari server...');
          const res = await apiCall('getAspekNilai', {
            kelas: currentClass.kelas,
            mapel: currentClass.mapel,
            aspek: currentAspek
          });
          showLoading(false);
          if (!res.success) { await showAlert('Gagal mengambil data: ' + res.message, 'Gagal'); return; }
          const nilaiKonversi = konversiDataDariServer(res.nilai || {});
          await kStorage.setJSON(nilaiTag(currentClass.kelas, currentClass.mapel, currentAspek), nilaiKonversi);
          await kStorage.setJSON(nilaiSyncMetaTag(currentClass.kelas, currentClass.mapel, currentAspek), { syncedAt: new Date().toISOString() });
          try { await kStorage.delete(pendingTag); } catch (e) {}
          aspekData.nilai = nilaiKonversi;
          aspekData.daftarTanggal = computeDaftarTanggal_(aspekData.nilai);
          renderAspekTable();
          refreshAspekSyncStatus();
          await showAlert('Data nilai berhasil diambil dari server.', 'Sinkron Berhasil');
          return;
        }

        showLoading(true, 'Memeriksa data di server...');
        const cekRes = await apiCall('getAspekNilai', {
          kelas: currentClass.kelas,
          mapel: currentClass.mapel,
          aspek: currentAspek
        });
        showLoading(false);
        if (!cekRes.success) { await showAlert('Gagal memeriksa data server: ' + cekRes.message, 'Gagal'); return; }

        const tanggalServer = computeDaftarTanggal_(cekRes.nilai || {});
        const tanggalLokalSet = new Set(computeDaftarTanggal_(nilaiLokal));
        const tanggalHanyaDiServer = tanggalServer.filter(t => !tanggalLokalSet.has(t));

        let hapusDiServer = false;
        if (tanggalHanyaDiServer.length) {
          const daftarTgl = tanggalHanyaDiServer.map(t => formatTanggalPanjang_(t)).join(', ');
          const pilihan = await showPilihanDataServer(
            `Terdapat data penilaian di server pada tanggal ${daftarTgl} yang tidak terdapat di lokal.`,
            'Data Server'
          );
          if (!pilihan || pilihan === 'batal') return;
          hapusDiServer = (pilihan === 'hapus');
        }

        const konfirmSinkron = await showKonfirmasi(
          `Data nilai pada perangkat ini untuk tanggal penilaian yang sama akan MENIMPA data yang sudah ada di server.\n\nLanjutkan sinkronisasi nilai ${currentAspek}?`,
          'Konfirmasi Sinkron Nilai'
        );
        if (!konfirmSinkron) return;

        showLoading(true, 'Menyinkronkan nilai ke server...');

        if (hapusDiServer && tanggalHanyaDiServer.length) {
          const delRes = await apiCall('deleteAspekNilai', {
            kelas: currentClass.kelas,
            mapel: currentClass.mapel,
            aspek: currentAspek,
            noPenilaian: tanggalHanyaDiServer,
            username: user.username
          });
          if (!delRes.success) {
            showLoading(false);
            await showAlert('Gagal menghapus di server: ' + delRes.message, 'Gagal');
            return;
          }
        }

        const siswa = await kStorage.getJSON(siswaTag(currentClass.kelas), []);
        const namaByNis = {};
        siswa.forEach(s => namaByNis[s.nis] = s.nama);

        // ============================================================
        // PERBAIKAN 2: HANYA KIRIM DATA MILIK SENDIRI
        // ============================================================
        const flatData = [];
        Object.keys(nilaiLokal).forEach(nis => {
          Object.keys(nilaiLokal[nis]).forEach(key => {
            const entry = nilaiLokal[nis][key];
            // Hanya kirim data milik sendiri
            if (entry && entry.username === user.username) {
              const tanggal = key.split('_')[0];
              if (entry.nilai !== undefined && entry.nilai !== null && entry.nilai !== '') {
                flatData.push({
                  nis: nis,
                  nama: namaByNis[nis] || '',
                  noPenilaian: tanggal,
                  nilai: entry.nilai,
                  username: entry.username
                });
              }
            }
          });
        });

        const res = await apiCall('sinkronNilaiAspek', {
          kelas: currentClass.kelas,
          mapel: currentClass.mapel,
          aspek: currentAspek,
          data: flatData,
          username: user.username
        });

        showLoading(false);
        if (!res.success) { await showAlert('Gagal sinkron: ' + res.message, 'Gagal'); return; }

        let nilaiHasil = konversiDataDariServer(res.nilai || {});

        if (hapusDiServer && tanggalHanyaDiServer.length) {
          tanggalHanyaDiServer.forEach(tgl => {
            Object.keys(nilaiHasil).forEach(nis => {
              Object.keys(nilaiHasil[nis] || {}).forEach(key => {
                if (key.startsWith(tgl + '_')) {
                  delete nilaiHasil[nis][key];
                }
              });
            });
          });
        }

        await kStorage.setJSON(nilaiTag(currentClass.kelas, currentClass.mapel, currentAspek), nilaiHasil);
        await kStorage.setJSON(nilaiSyncMetaTag(currentClass.kelas, currentClass.mapel, currentAspek), { syncedAt: new Date().toISOString() });
        try { await kStorage.delete(pendingTag); } catch (e) {}

        aspekData.nilai = nilaiHasil;
        aspekData.daftarTanggal = computeDaftarTanggal_(aspekData.nilai);
        renderAspekTable();
        refreshAspekSyncStatus();

        await showAlert('Sinkron nilai berhasil. Rekap di server telah diperbarui.', 'Sinkron Berhasil');
      } catch (e) {
        showLoading(false);
        await showAlert('Gagal sinkron: ' + e.message, 'Gagal');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    // ==========================================
    // FORMAT TANGGAL
    // ==========================================
    function todayISO_() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const NAMA_BULAN_ID_ = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    function formatTanggalSingkat_(iso) {
      const parts = String(iso).split('-');
      if (parts.length === 3) return parts[2] + '/' + parts[1];
      return iso;
    }

    function formatTanggalPanjang_(iso) {
      const parts = String(iso).split('-');
      if (parts.length === 3) {
        const tahun = parts[0];
        const bulanIdx = parseInt(parts[1], 10) - 1;
        const tanggal = parseInt(parts[2], 10);
        const namaBulan = NAMA_BULAN_ID_[bulanIdx] || parts[1];
        return `${tanggal} ${namaBulan} ${tahun}`;
      }
      return iso;
    }

    // ==========================================
    // RENDER TABEL ASPEK (TAMPILKAN SEMUA NILAI DARI USERNAME BERBEDA)
    // ==========================================
    function renderAspekTable() {
      const thead = document.getElementById('theadAspek');
      const tbody = document.getElementById('tbodyAspek');

      const daftarTanggal = aspekData.daftarTanggal || [];

      let thHTML = `<tr><th class="sticky-col text-left">Nama Siswa</th>`;
      daftarTanggal.forEach(tgl => {
        let adaOwn = false;
        let adaOther = false;
        Object.values(aspekData.nilai || {}).forEach(nMap => {
          Object.keys(nMap || {}).forEach(key => {
            if (key.startsWith(tgl + '_')) {
              const entry = nMap[key];
              if (entry && typeof entry === 'object' && entry.username) {
                if (entry.username === user.username) adaOwn = true;
                else adaOther = true;
              }
            }
          });
        });

        const label = formatTanggalSingkat_(tgl);
        let actionsHtml = '';
        if (adaOwn) {
          actionsHtml += `<button class="col-action-btn" onclick="openEditKolom('${tgl}')" title="Edit ${label}">✎</button>`;
        }
        if (adaOwn || adaOther) {
          actionsHtml += `<button class="col-action-btn danger" onclick="hapusKolom('${tgl}')" title="Hapus ${label}">🗑</button>`;
        }
        thHTML += `<th>
          <div>${label}</div>
          <div class="col-actions">${actionsHtml}</div>
        </th>`;
      });
      thHTML += `</tr>`;
      thead.innerHTML = thHTML;

      tbody.innerHTML = '';

      if (daftarTanggal.length === 0) {
        tbody.innerHTML = `<tr><td colspan="1" class="empty-state">Belum ada penilaian. Tekan "+ Tambah Penilaian" di bawah untuk mulai input nilai.</td></tr>`;
        return;
      }

      (aspekData.siswa || []).forEach(s => {
        const nMap = aspekData.nilai[s.nis] || {};
        let tr = document.createElement('tr');

        let tdHTML = `<td class="sticky-col text-left">
          <div style="font-weight:600; font-size:13px; white-space:normal; word-break:break-word;">${s.nama || ''}</div>
          <div style="font-size:11px; color:var(--text-muted);">${s.nis || ''}</div>
        </td>`;

        daftarTanggal.forEach(tgl => {
          let ownEntry = null;
          let otherEntries = [];

          // Kumpulkan SEMUA entri untuk tanggal ini
          Object.keys(nMap || {}).forEach(key => {
            if (key.startsWith(tgl + '_')) {
              const entry = nMap[key];
              if (entry && typeof entry === 'object' && entry.username) {
                if (entry.username === user.username) {
                  ownEntry = entry;
                } else {
                  otherEntries.push(entry);
                }
              } else if (entry !== undefined && entry !== null && entry !== '') {
                // Data lama: anggap milik sendiri
                ownEntry = { nilai: entry, username: user.username };
              }
            }
          });

          let displayHtml = '';
          if (ownEntry) {
            // Tampilkan milik sendiri dengan background hijau
            displayHtml = `<span style="background: var(--own-bg); color: var(--own-text); padding: 2px 8px; border-radius: 4px; display: inline-block; font-weight:600;">${ownEntry.nilai}</span>`;
            // Tambahkan nilai dari guru lain jika ada
            if (otherEntries.length > 0) {
              const otherVals = otherEntries.map(e =>
                `<span style="background: var(--other-bg); color: var(--other-text); padding: 2px 6px; border-radius: 4px; margin: 1px; display: inline-block; font-size: 11px;" title="${e.username}">${e.nilai}</span>`
              ).join(' ');
              displayHtml += ' ' + otherVals;
            }
          } else if (otherEntries.length > 0) {
            // Hanya data dari guru lain
            const otherVals = otherEntries.map(e =>
              `<span style="background: var(--other-bg); color: var(--other-text); padding: 2px 6px; border-radius: 4px; margin: 1px; display: inline-block; font-size: 11px;" title="${e.username}">${e.nilai}</span>`
            ).join(' ');
            displayHtml = otherVals;
          } else {
            displayHtml = '-';
          }

          tdHTML += `<td class="value-cell" style="padding: 6px 4px; min-width: 60px;">${displayHtml}</td>`;
        });

        tr.innerHTML = tdHTML;
        tbody.appendChild(tr);
      });
    }

    // ==========================================
    // MODAL: TAMBAH / EDIT KOLOM
    // ==========================================
    function addKolomPenilaian() {
      openKolomModal_(todayISO_(), false);
    }

    function openEditKolom(tanggal) {
      openKolomModal_(tanggal, true);
    }

    function openKolomModal_(tanggal, isEdit) {
      document.getElementById('modalKolomTitle').textContent =
        isEdit ? ('Edit Penilaian - ' + formatTanggalPanjang_(tanggal)) : 'Tambah Penilaian';

      const body = document.getElementById('modalKolomBody');
      body.innerHTML = '';

      const tglRow = document.createElement('div');
      tglRow.className = 'modal-row';
      tglRow.innerHTML = `
        <div>
          <div class="modal-siswa-name">Tanggal Penilaian</div>
        </div>
        <input type="date" id="modalKolomTanggal" value="${tanggal}" ${isEdit ? 'disabled' : ''}>
      `;
      body.appendChild(tglRow);

      aspekData.siswa.forEach(s => {
        const row = document.createElement('div');
        row.className = 'modal-row';

        const nMap = aspekData.nilai[s.nis] || {};
        let existingVal = '';
        Object.keys(nMap).forEach(key => {
          if (key.startsWith(tanggal + '_')) {
            const entry = nMap[key];
            if (entry.username === user.username) {
              existingVal = entry.nilai;
            }
          }
        });

        let fieldHTML;
        if (currentAspek === 'KEHADIRAN') {
          const opts = [{ v: '', label: '-' }, { v: 'H', label: 'H' }, { v: 'S', label: 'S' }, { v: 'I', label: 'I' }, { v: 'A', label: 'A' }];
          const curUpper = existingVal ? String(existingVal).toUpperCase() : '';
          fieldHTML = `<select class="siswa-value-input" data-nis="${s.nis}">` +
            opts.map(o => `<option value="${o.v}" ${o.v === curUpper ? 'selected' : ''}>${o.label}</option>`).join('') +
            `</select>`;
        } else {
          fieldHTML = `<input type="number" min="0" max="100" class="siswa-value-input" data-nis="${s.nis}" value="${existingVal}">`;
        }

        row.innerHTML = `
          <div>
            <div class="modal-siswa-name">${s.nama}</div>
            <div class="modal-siswa-nis">${s.nis}</div>
          </div>
          ${fieldHTML}
        `;
        body.appendChild(row);
      });

      document.getElementById('modalKolom').classList.add('active');
    }

    function closeModalKolom() {
      document.getElementById('modalKolom').classList.remove('active');
    }

    async function simpanKolomModal() {
      const btn = document.getElementById('btnSimpanKolom');
      btn.disabled = true;

      const tanggalInput = document.getElementById('modalKolomTanggal');
      const tanggal = tanggalInput ? tanggalInput.value : '';

      if (!tanggal) {
        btn.disabled = false;
        await showAlert('Tanggal penilaian wajib diisi.', 'Perhatian');
        return;
      }

      const inputs = document.querySelectorAll('#modalKolomBody .siswa-value-input');
      const flatData = [];

      inputs.forEach(el => {
        const val = el.value.trim();
        if (val !== '') {
          let nilaiFinal;
          if (currentAspek === 'KEHADIRAN') {
            nilaiFinal = val.toUpperCase();
          } else {
            const numVal = Number(val);
            if (!isNaN(numVal) && numVal >= 0 && numVal <= 100) {
              nilaiFinal = numVal;
            } else {
              return;
            }
          }
          flatData.push({
            nis: el.getAttribute('data-nis'),
            noPenilaian: tanggal,
            nilai: nilaiFinal,
            username: user.username
          });
        }
      });

      if (!flatData.length) {
        btn.disabled = false;
        await showAlert('Isi minimal satu nilai sebelum menyimpan.', 'Perhatian');
        return;
      }

      showLoading(true, 'Menyimpan (offline)...');
      const msg = document.getElementById('saveMsg');

      try {
        flatData.forEach(item => {
          if (!aspekData.nilai[item.nis]) aspekData.nilai[item.nis] = {};
          const key = item.noPenilaian + '_' + item.username;
          aspekData.nilai[item.nis][key] = {
            nilai: item.nilai,
            username: item.username
          };
        });

        await kStorage.setJSON(nilaiTag(currentClass.kelas, currentClass.mapel, currentAspek), aspekData.nilai);

        aspekData.daftarTanggal = computeDaftarTanggal_(aspekData.nilai);
        renderAspekTable();
        closeModalKolom();

        msg.style.color = 'var(--success)';
        msg.textContent = 'Tersimpan offline ✓ (tekan "Sinkron Nilai" di halaman ini untuk mengirim ke server)';
        setTimeout(() => msg.textContent = '', 4000);
      } catch (e) {
        msg.style.color = 'var(--error)';
        msg.textContent = 'Gagal: ' + e.message;
      } finally {
        showLoading(false);
        btn.disabled = false;
      }
    }

    // ==========================================
    // HAPUS KOLOM
    // ==========================================
    async function hapusKolom(tanggal) {
      let adaOwn = false;
      let adaOther = false;
      Object.values(aspekData.nilai || {}).forEach(nMap => {
        Object.keys(nMap || {}).forEach(key => {
          if (key.startsWith(tanggal + '_')) {
            const entry = nMap[key];
            if (entry && typeof entry === 'object' && entry.username) {
              if (entry.username === user.username) adaOwn = true;
              else adaOther = true;
            }
          }
        });
      });

      let pilihan;
      if (adaOwn) {
        pilihan = await showPilihanHapus(
          `Hapus semua nilai pada tanggal ${formatTanggalPanjang_(tanggal)}?\n\n` +
          `"Hapus Lokal" hanya menghapus di perangkat ini (data milik Anda).\n\n` +
          `"Hapus di Server" langsung menghapus di server saat ini juga dan membutuhkan koneksi internet.`,
          'Hapus Penilaian'
        );
      } else if (adaOther) {
        pilihan = await showPilihanHapus(
          `Hapus semua nilai pada tanggal ${formatTanggalPanjang_(tanggal)}?\n\n` +
          `Kolom ini adalah milik guru lain.\n` +
          `"Hapus Lokal" hanya menghapus di perangkat ini (tidak di server).`,
          'Hapus Penilaian (Guru Lain)'
        );
        if (pilihan === 'server') {
          await showAlert('Anda tidak dapat menghapus data milik guru lain di server.', 'Tidak Diizinkan');
          return;
        }
      } else {
        return;
      }

      if (!pilihan || pilihan === 'batal') return;

      const msg = document.getElementById('saveMsg');

      if (pilihan === 'lokal') {
        showLoading(true, 'Menghapus (offline)...');
        try {
          Object.keys(aspekData.nilai).forEach(nis => {
            const nMap = aspekData.nilai[nis];
            Object.keys(nMap).forEach(key => {
              if (key.startsWith(tanggal + '_')) {
                if (adaOwn) {
                  if (nMap[key].username === user.username) {
                    delete nMap[key];
                  }
                } else {
                  delete nMap[key];
                }
              }
            });
            if (Object.keys(nMap).length === 0) {
              delete aspekData.nilai[nis];
            }
          });

          await kStorage.setJSON(nilaiTag(currentClass.kelas, currentClass.mapel, currentAspek), aspekData.nilai);

          aspekData.daftarTanggal = computeDaftarTanggal_(aspekData.nilai);
          renderAspekTable();

          msg.style.color = 'var(--success)';
          msg.textContent = `Penilaian tanggal ${formatTanggalPanjang_(tanggal)} dihapus di perangkat ini ✓`;
          setTimeout(() => msg.textContent = '', 4000);
        } catch (e) {
          msg.style.color = 'var(--error)';
          msg.textContent = 'Gagal: ' + e.message;
        } finally {
          showLoading(false);
        }
        return;
      }

      if (pilihan === 'server' && adaOwn) {
        showLoading(true, 'Menghapus di server...');
        try {
          const delRes = await apiCall('deleteAspekNilai', {
            kelas: currentClass.kelas,
            mapel: currentClass.mapel,
            aspek: currentAspek,
            noPenilaian: [tanggal],
            username: user.username
          });

          if (delRes.offline) {
            showLoading(false);
            await showAlert(
              'Tidak ada koneksi internet. Untuk menghapus di server, pastikan perangkat terhubung ke internet lalu coba lagi.\n\nAnda juga bisa memilih "Hapus Lokal" untuk menghapus di perangkat ini terlebih dahulu.',
              'Perlu Koneksi Internet'
            );
            return;
          }

          if (!delRes.success) {
            showLoading(false);
            await showAlert('Gagal menghapus di server: ' + delRes.message, 'Gagal');
            return;
          }

          Object.keys(aspekData.nilai).forEach(nis => {
            const nMap = aspekData.nilai[nis];
            Object.keys(nMap).forEach(key => {
              if (key.startsWith(tanggal + '_') && nMap[key].username === user.username) {
                delete nMap[key];
              }
            });
            if (Object.keys(nMap).length === 0) {
              delete aspekData.nilai[nis];
            }
          });

          await kStorage.setJSON(nilaiTag(currentClass.kelas, currentClass.mapel, currentAspek), aspekData.nilai);

          aspekData.daftarTanggal = computeDaftarTanggal_(aspekData.nilai);
          renderAspekTable();
          refreshAspekSyncStatus();

          msg.style.color = 'var(--success)';
          msg.textContent = `Penilaian tanggal ${formatTanggalPanjang_(tanggal)} berhasil dihapus di server ✓`;
          setTimeout(() => msg.textContent = '', 4000);
        } catch (e) {
          msg.style.color = 'var(--error)';
          msg.textContent = 'Gagal: ' + e.message;
        } finally {
          showLoading(false);
        }
      }
    }
  </script>
